name: StutterSense v2 synthetic checks

on:
  push:
    paths:
      - "stuttersense_v2/**"
      - "configs/**"
      - "docs/**"
      - "tests/test_v2.py"
      - "scripts/validate_v2.py"
      - "StutterSense_v2.ipynb"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "stuttersense_v2/**"
      - "configs/**"
      - "docs/**"
      - "tests/test_v2.py"
      - "scripts/validate_v2.py"
      - "StutterSense_v2.ipynb"
      - ".github/workflows/v2-ci.yml"

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2,<3" "scikit-learn>=1.4,<2" "nbformat>=5.9,<6"
      - name: Validate v2 structure
        run: python scripts/validate_v2.py
      - name: Run v2 synthetic tests
        run: python -m unittest discover -s tests -p 'test_v2.py' -v
